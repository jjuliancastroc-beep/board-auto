name: board
on:
  schedule:
    - cron: "0 14 * * *"   # 8:00 AM CT - morning card
    - cron: "0 23 * * *"   # 5:00 PM CT - injury/line refresh before evening games
    - cron: "0 6 * * *"    # 12:00 AM CT - grade the night's finals
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: board
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: TZ=America/Chicago python -m board.run
      - name: Save results
        run: |
          git config user.name "board-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || git commit -m "Board update $(TZ=America/Chicago date '+%Y-%m-%d %H:%M CT')"
          git push
