name: board
on:
  schedule:
    # GitHub's timer is unreliable (it often skips or delays a slot), so the Board asks every 10 minutes and
    # the "Fresh enough?" step below skips the work if a build finished in the last 20 minutes.
    - cron: "4,14,24,34,44,54 13-23 * * *"   # 7 AM - 6 PM CT
    - cron: "4,14,24,34,44,54 0-8 * * *"     # 6 PM - 3 AM CT; the last runs grade the night's finals
  workflow_dispatch:
    inputs:
      weekly:
        description: "Force the weekly report"
        type: boolean
        default: false
  issue_comment:
    types: [created]
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: board
  cancel-in-progress: false
jobs:
  run:
    # issue events only count when they come from the owner - anyone else is ignored
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.sender.login == 'jjuliancastroc-beep'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v4
      - name: Fresh enough?
        id: fresh
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          echo "last build ${age}s ago"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$age" -lt 1200 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.fresh.outputs.skip != '1'
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        if: steps.fresh.outputs.skip != '1'
      - name: Self-test
        if: steps.fresh.outputs.skip != '1'
        run: python -m unittest tests.test_core -v
      - name: Apply your commands
        if: steps.fresh.outputs.skip != '1'
        run: python -m board.commands
      - name: Build the Board
        if: steps.fresh.outputs.skip != '1'
        run: python -m board.run ${{ inputs.weekly && '--weekly' || '' }}
      - name: Save results
        if: steps.fresh.outputs.skip != '1'
        run: |
          git config user.name "board-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet && exit 0
          git commit -m "Board update $(date '+%Y-%m-%d %H:%M CT')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
