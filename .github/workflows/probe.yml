name: probe
on: workflow_dispatch
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -w "\nHTTP %{http_code}\n" https://models.github.ai/inference/chat/completions \
            -H "Content-Type: application/json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Reply with only the word banana"}]}' | head -c 1500; echo; curl -s -o /dev/null -w "catalog %{http_code}\n" https://models.github.ai/catalog/models -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
